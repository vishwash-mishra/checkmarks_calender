<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Check Calendar</title>
<style>
:root{--bg:#f3f6f1;--surface:#ffffff;--ink:#1d2b24;--muted:#6b7a72;--line:#dbe3dc;--accent:#2f7d5b;--accent-ink:#ffffff;--today:#e8a33d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--surface:#1c2b23;--ink:#e6efe9;--muted:#93a89b;--line:#2c3f34;--accent:#4fb787;--accent-ink:#0c1a12;--today:#e8a33d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14201a;--surface:#1c2b23;--ink:#e6efe9;--muted:#93a89b;--line:#2c3f34;--accent:#4fb787;--accent-ink:#0c1a12;--today:#e8a33d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Iowan Old Style",serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 14px;font-weight:700;letter-spacing:-.01em}
.tasks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font:inherit;font-size:.95rem;padding:7px 14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible,.nav button:focus-visible,.day:focus-visible,.add input:focus-visible,.add button:focus-visible{outline:3px solid var(--today);outline-offset:2px}
.add{display:flex;gap:8px;margin-bottom:18px}
.add input{flex:1;min-width:0;font:inherit;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.add button,.nav button{font:inherit;padding:8px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav h2{margin:0;font-size:1.2rem}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;font-size:.8rem;color:var(--muted);padding-bottom:4px}
.day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:.85rem;cursor:pointer;position:relative;padding:0}
.day.empty{border:none;cursor:default}
.day.today{border-color:var(--today);border-width:2.5px}
.day.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day svg{width:55%;height:55%;display:none}
.day.done svg{display:block}
.day.done .n{font-size:.7rem;opacity:.85;position:absolute;top:3px;left:6px}
.stats{display:flex;gap:10px;margin-top:14px}
.stat{flex:1;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.5rem}
.stat span{font-size:.8rem;color:var(--muted)}
.foot{margin-top:14px;display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.foot button{font:inherit;font-size:.85rem;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
</style>
</head>
<body>
<main>
<h1>Daily check calendar</h1>
<div class="tasks" id="tasks" role="group" aria-label="Tasks"></div>
<div class="add"><input id="newTask" placeholder="Add a task, e.g. Study 1 hour" maxlength="40" aria-label="New task name"><button id="addBtn">Add task</button></div>
<div class="panel">
<div class="nav"><button id="prev" aria-label="Previous month">&lsaquo;</button><h2 id="title"></h2><button id="next" aria-label="Next month">&rsaquo;</button></div>
<div class="grid" id="grid"></div>
</div>
<div class="stats">
<div class="stat"><b id="sMonth">0</b><span>days this month</span></div>
<div class="stat"><b id="sStreak">0</b><span>day streak</span></div>
<div class="stat"><b id="sBest">0</b><span>best streak</span></div>
</div>
<div class="foot"><span><button id="exp">Export backup</button> &nbsp; <button id="imp">Import backup</button><input type="file" id="file" accept=".json,application/json" hidden></span></div>
<div class="foot"><span id="status">Saved on this device</span><span><button id="delTask">Delete task</button> &nbsp; <button id="reset">Clear month</button></span></div>
</main>
<script>
const KEY="checkcal-v1";
let state={tasks:[{id:"t1",name:"My daily task"}],active:"t1",checks:{}};
try{const s=localStorage.getItem(KEY);if(s){const p=JSON.parse(s);if(p&&p.tasks&&p.tasks.length)state=p}}catch(e){}
function setStatus(t){$("status").textContent=t}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));setStatus("Saved on this device")}catch(e){setStatus("Could not save. Use Export backup.")}}
const now=new Date();let vy=now.getFullYear(),vm=now.getMonth();
const pad=n=>String(n).padStart(2,"0");
const ymd=(y,m,d)=>y+"-"+pad(m+1)+"-"+pad(d);
const todayStr=ymd(now.getFullYear(),now.getMonth(),now.getDate());
const $=id=>document.getElementById(id);
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
function marks(){return state.checks[state.active]||(state.checks[state.active]={})}
function streaks(){
  const m=marks();let best=0,run=0;
  const keys=Object.keys(m).sort();
  let prev=null;
  keys.forEach(k=>{const d=new Date(k+"T00:00:00");
    if(prev&&Math.round((d-prev)/864e5)===1)run++;else run=1;
    if(run>best)best=run;prev=d});
  let cur=0;const d=new Date();
  if(!m[todayStr])d.setDate(d.getDate()-1);
  while(m[ymd(d.getFullYear(),d.getMonth(),d.getDate())]){cur++;d.setDate(d.getDate()-1)}
  return{cur,best}
}
function render(){
  const t=$("tasks");t.innerHTML="";
  state.tasks.forEach(k=>{const b=document.createElement("button");b.className="chip";b.textContent=k.name;
    b.setAttribute("aria-pressed",k.id===state.active);b.onclick=()=>{state.active=k.id;save();render()};t.appendChild(b)});
  $("title").textContent=new Date(vy,vm,1).toLocaleDateString(undefined,{month:"long",year:"numeric"});
  const g=$("grid");g.innerHTML="";
  ["S","M","T","W","T","F","S"].forEach(x=>{const e=document.createElement("div");e.className="dow";e.textContent=x;g.appendChild(e)});
  const first=new Date(vy,vm,1).getDay(),dim=new Date(vy,vm+1,0).getDate(),m=marks();let count=0;
  for(let i=0;i<first;i++){const e=document.createElement("div");e.className="day empty";g.appendChild(e)}
  for(let d=1;d<=dim;d++){
    const key=ymd(vy,vm,d),done=!!m[key];if(done)count++;
    const b=document.createElement("button");
    b.className="day"+(done?" done":"")+(key===todayStr?" today":"");
    b.setAttribute("aria-label",key+(done?", done":", not done"));b.setAttribute("aria-pressed",done);
    b.innerHTML='<span class="n">'+d+'</span>'+CHECK+(done?"":'<span>'+d+'</span>');
    b.onclick=()=>{if(m[key])delete m[key];else m[key]=1;save();render()};
    g.appendChild(b)}
  const s=streaks();$("sMonth").textContent=count;$("sStreak").textContent=s.cur;$("sBest").textContent=s.best;
}
$("prev").onclick=()=>{vm--;if(vm<0){vm=11;vy--}render()};
$("next").onclick=()=>{vm++;if(vm>11){vm=0;vy++}render()};
function addTask(){const v=$("newTask").value.trim();if(!v)return;
  const id="t"+Date.now();state.tasks.push({id,name:v});state.active=id;$("newTask").value="";save();render()}
$("addBtn").onclick=addTask;
$("newTask").addEventListener("keydown",e=>{if(e.key==="Enter")addTask()});
$("delTask").onclick=()=>{if(state.tasks.length<2){alert("Keep at least one task. Add another first to delete this one.");return}
  if(!confirm("Delete this task and all its checkmarks?"))return;
  delete state.checks[state.active];state.tasks=state.tasks.filter(k=>k.id!==state.active);state.active=state.tasks[0].id;save();render()};
$("reset").onclick=()=>{if(!confirm("Clear all checkmarks shown in this month?"))return;
  const m=marks(),p=vy+"-"+pad(vm+1)+"-";Object.keys(m).forEach(k=>{if(k.startsWith(p))delete m[k]});save();render()};

$("exp").onclick=()=>{const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:"application/json"}));
  a.download="check-calendar-backup.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const p=JSON.parse(r.result);if(!p||!Array.isArray(p.tasks)||!p.tasks.length||!p.checks)throw 0;
    if(!confirm("Replace current data with this backup?"))return;state=p;if(!state.tasks.some(t=>t.id===state.active))state.active=state.tasks[0].id;save();render()}
    catch(x){alert("That file is not a valid backup.")}};r.readAsText(f);e.target.value=""};
render();
</script>
</body>
</html>
